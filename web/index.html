<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Till</title>

<!--
  Hand-written CSS rather than a framework CDN. A till has to open and work on a
  counter machine with a bad connection, and waiting on a CDN before the screen
  is usable is the wrong trade. It also means the page works with no network at
  all, which is the whole point of the offline design.
-->
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f3f4f6;
    --ok: #047857;
    --bad: #b91c1c;
    --warn: #b45309;
    --accent: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  .wrap { display: grid; gap: 12px; padding: 12px; max-width: 1400px; margin: 0 auto;
          grid-template-columns: 1fr; }
  /* Cart on the right on a wide screen, stacked below on a phone. */
  @media (min-width: 900px) { .wrap { grid-template-columns: 1fr 24rem; } }

  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px;
           flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .status { font-size: 13px; color: var(--muted); margin: 0 0 0 auto; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.bad { color: var(--bad); }
  nav a { font-size: 13px; color: var(--accent); }

  .card { background: #fff; border-radius: 10px; padding: 12px;
          box-shadow: 0 1px 2px rgb(0 0 0 / .06); }

  /* --- entry -------------------------------------------------------------- */
  /* Big, because this field is where the whole shift is spent. */
  #entry {
    width: 100%; font-size: 22px; padding: 12px 14px; border: 2px solid var(--line);
    border-radius: 8px; font-variant-numeric: tabular-nums;
  }
  #entry:focus { outline: none; border-color: var(--accent);
                 box-shadow: 0 0 0 3px rgb(29 78 216 / .15); }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  kbd { font: inherit; font-size: 11px; background: var(--bg); border: 1px solid var(--line);
        border-radius: 4px; padding: 1px 5px; }

  /* --- tiles -------------------------------------------------------------- */
  #grid { display: grid; gap: 10px; margin-top: 12px;
          grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .tile {
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    padding: 8px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; cursor: pointer; text-align: left; font: inherit;
    /* 44px is the accessible minimum touch target; these are far larger, which
       is what makes them usable at speed on a tablet. */
    min-height: 44px;
  }
  .tile:hover { border-color: var(--ink); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:disabled { opacity: .45; cursor: not-allowed; }
  .tile-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px;
              background: var(--bg); }
  .tile-initial { display: grid; place-items: center; font-size: 26px; font-weight: 700; }
  .tile-name { font-weight: 600; font-size: 14px; line-height: 1.25;
               overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
               -webkit-box-orient: vertical; }
  .tile-price { font-variant-numeric: tabular-nums; }
  .tile-meta { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; grid-column: 1 / -1; }

  /* --- cart --------------------------------------------------------------- */
  #cart { list-style: none; margin: 0 0 10px; padding: 0; max-height: 45vh;
          overflow-y: auto; }
  .line { display: grid; grid-template-columns: 1fr auto auto auto auto auto;
          align-items: center; gap: 6px; padding: 7px 0;
          border-bottom: 1px solid var(--line); }
  /* The last-touched line is highlighted because +/- act on it. */
  .line-last { background: #eff6ff; }
  .line-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line button { width: 30px; height: 30px; border: 1px solid var(--line);
                 border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
  .line-qty { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  .line-amt { min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }
  .line-del { color: var(--bad); }

  dl { margin: 0 0 10px; font-size: 14px; }
  dl div { display: flex; justify-content: space-between; padding: 2px 0; }
  dl .grand { font-size: 20px; font-weight: 700; border-top: 2px solid var(--ink);
              padding-top: 6px; margin-top: 4px; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }

  label { font-size: 13px; color: var(--muted); }
  select { font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
           width: 100%; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row > * { flex: 1; }

  button.primary {
    width: 100%; padding: 14px; font-size: 18px; font-weight: 700; color: #fff;
    background: var(--ink); border: 0; border-radius: 8px; cursor: pointer;
  }
  button.primary:disabled { background: #cbd5e1; cursor: not-allowed; }
  button.ghost { padding: 9px; font: inherit; background: #fff; cursor: pointer;
                 border: 1px solid var(--line); border-radius: 7px; }
  button.ghost:disabled { opacity: .5; cursor: not-allowed; }

  .flash { min-height: 20px; font-size: 13px; margin: 8px 0 0; }
  .flash.ok { color: var(--ok); }
  .flash.bad { color: var(--bad); font-weight: 600; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px;
           color: var(--muted); margin-top: 8px; }
  .check input { width: 16px; height: 16px; }

  /* Visible to a screen reader, not on screen. The entry field has a visible
     placeholder but a placeholder is not a label. */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
             overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>POS Till</h1>
    <nav><a href="admin.html">Items &amp; settings →</a></nav>
    <p id="status" class="status" role="status" aria-live="polite">Connecting…</p>
  </header>

  <!-- ---------------------------------------------------------------- -->
  <!-- Entry + catalog                                                  -->
  <!-- ---------------------------------------------------------------- -->
  <main class="card">
    <label class="sr-only" for="entry">Item code, barcode or name</label>
    <input id="entry" type="text" inputmode="text" autocomplete="off"
           autocapitalize="off" spellcheck="false"
           placeholder="Code, barcode or name…  (3*12 for three)"
           aria-describedby="entry-hint">
    <p class="hint" id="entry-hint">
      <kbd>Enter</kbd> add &nbsp; <kbd>3*12</kbd> quantity &nbsp;
      <kbd>F2</kbd> charge &nbsp; <kbd>F4</kbd> print &nbsp;
      <kbd>+</kbd>/<kbd>−</kbd> last line &nbsp; <kbd>Esc</kbd> clear
    </p>

    <div id="grid" role="list" aria-label="Catalog"></div>
  </main>

  <!-- ---------------------------------------------------------------- -->
  <!-- Cart                                                             -->
  <!-- ---------------------------------------------------------------- -->
  <aside class="card">
    <h2 style="font-size:15px;margin:0 0 8px">
      Cart <span style="color:var(--muted);font-weight:400">(<span id="count">0</span>)</span>
    </h2>

    <ul id="cart" aria-label="Cart lines"></ul>

    <dl>
      <div><dt>Taxable</dt><dd id="taxable">0.00</dd></div>
      <div><dt>GST</dt><dd id="tax">0.00</dd></div>
      <div id="roundoff-row" hidden><dt>Round off</dt><dd id="roundoff">0.00</dd></div>
      <div class="grand"><dt>Total</dt><dd id="total">0.00</dd></div>
    </dl>

    <div class="row">
      <div>
        <label for="paymode">Payment</label>
        <select id="paymode">
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="card">Card</option>
          <option value="bank">Bank</option>
          <option value="credit">Credit (unpaid)</option>
        </select>
      </div>
      <div>
        <label for="format">Bill</label>
        <select id="format">
          <option value="58mm">58mm roll</option>
          <option value="80mm">80mm roll</option>
          <option value="a4">A4 invoice</option>
        </select>
      </div>
    </div>

    <button id="charge" class="primary" disabled>Charge <kbd>F2</kbd></button>

    <div class="row" style="margin-top:8px">
      <button id="reprint" class="ghost" disabled>Print bill</button>
      <button id="share" class="ghost" disabled>Share / PDF</button>
    </div>

    <label class="check">
      <input type="checkbox" id="autoprint"> Print automatically after each sale
    </label>

    <p id="flash" class="flash" role="status" aria-live="polite"></p>
  </aside>
</div>

<!--
  Three classic scripts, in order: config, then the bill helper, then the app.
  Not ES modules — a module is fetched under CORS rules and a file:// page has an
  opaque origin, so imports would fail and this would only work behind a web
  server. See the note at the top of config.js.
-->
<script src="config.js"></script>
<script src="bill.js"></script>
<script src="app.js"></script>
</body>
</html>
