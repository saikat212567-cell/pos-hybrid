<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS — Web Terminal</title>

<!-- Tailwind via CDN: no build step, no node_modules, nothing to compile. -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Supabase JS client (ESM build loaded in the module script below). -->
</head>

<body class="bg-slate-100 text-slate-900">

<div class="mx-auto max-w-6xl p-4">

  <header class="mb-4 flex items-baseline justify-between gap-4">
    <h1 class="text-2xl font-bold">POS Terminal</h1>
    <!-- Connection state. aria-live so screen readers hear it change. -->
    <p id="status" role="status" aria-live="polite" class="text-sm text-slate-500">Connecting…</p>
  </header>

  <div class="grid gap-4 lg:grid-cols-[1fr_22rem]">

    <!-- ------------------------------------------------------------------ -->
    <!-- Catalog                                                            -->
    <!-- ------------------------------------------------------------------ -->
    <section aria-labelledby="catalog-h" class="rounded-xl bg-white p-4 shadow-sm">
      <div class="mb-3 flex items-center gap-3">
        <h2 id="catalog-h" class="font-semibold">Catalog</h2>
        <label class="sr-only" for="search">Search products</label>
        <input id="search" type="search" placeholder="Search…"
               class="ml-auto w-40 rounded-lg border border-slate-300 px-3 py-1.5 text-sm
                      focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900/20">
      </div>
      <div id="grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3"></div>
    </section>

    <!-- ------------------------------------------------------------------ -->
    <!-- Cart                                                               -->
    <!-- ------------------------------------------------------------------ -->
    <section aria-labelledby="cart-h" class="flex h-fit flex-col rounded-xl bg-white p-4 shadow-sm lg:sticky lg:top-4">
      <h2 id="cart-h" class="mb-3 font-semibold">Cart</h2>

      <ul id="cart" class="mb-3 max-h-80 divide-y divide-slate-100 overflow-y-auto"></ul>

      <dl class="mb-3 space-y-1 border-t border-slate-200 pt-3 text-sm">
        <div class="flex justify-between"><dt>Subtotal</dt><dd id="subtotal">0.00</dd></div>
        <div class="flex justify-between"><dt>Tax (<span id="taxpct">5</span>%)</dt><dd id="tax">0.00</dd></div>
        <div class="flex justify-between text-base font-bold"><dt>Total</dt><dd id="total">0.00</dd></div>
      </dl>

      <button id="checkout" disabled
              class="rounded-lg bg-slate-900 px-4 py-2.5 font-semibold text-white
                     hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900
                     focus:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-300">
        Charge
      </button>
      <p id="receipt" role="status" aria-live="polite" class="mt-2 min-h-5 text-sm"></p>
    </section>
  </div>
</div>

<script type="module">
// ===========================================================================
// CONFIG — point these at your deployed Worker (see worker/README.md).
//
// API_TOKEN is the shared secret you set with `wrangler secret put POS_TOKEN`.
// It's visible to anyone who views source, so it only keeps strangers out of
// a write-only sales endpoint. Rotate it by setting a new secret and editing
// this file.
// ===========================================================================
const API_BASE = 'https://pos-api.saikat212567.workers.dev';
// Paste your POS_TOKEN here to use this file locally. Do NOT commit the real
// value — see "Serving the web app" in README.md.
const API_TOKEN = 'YOUR-POS-TOKEN';
const TAX_RATE = 0.05;

const $ = id => document.getElementById(id);

// Money is integer cents end to end; only formatting divides by 100. Floats
// accumulate error once you start summing them, and this sums every line.
const money = cents => (cents / 100).toFixed(2);

const api = (path, opts = {}) =>
  fetch(API_BASE + path, {
    ...opts,
    headers: {
      Authorization: `Bearer ${API_TOKEN}`,
      'Content-Type': 'application/json',
      ...opts.headers,
    },
  });

// Product names come from the database, and both grid and cart render via
// innerHTML. Escape before interpolating so a name containing markup can't
// inject script into the terminal.
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Fallback catalog so the terminal is usable before the Worker is deployed.
// Prices in cents, matching the API.
const DEMO = [
  { id: 'demo-1', name: 'Espresso',   price: 250, stock: 100 },
  { id: 'demo-2', name: 'Cappuccino', price: 375, stock: 100 },
  { id: 'demo-3', name: 'Croissant',  price: 295, stock: 40  },
  { id: 'demo-4', name: 'Veg Wrap',   price: 600, stock: 20  },
];

let products = [];
const cart = new Map();   // product id -> { ...product, qty }

// ---------------------------------------------------------------------------
// Catalog
// ---------------------------------------------------------------------------
async function loadProducts() {
  try {
    const res = await api('/products');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    products = await res.json();
    $('status').textContent = `Connected — ${products.length} products`;
    $('status').className = 'text-sm text-emerald-600';
  } catch (err) {
    products = DEMO;
    $('status').textContent = `Offline — demo catalog (${err.message})`;
    $('status').className = 'text-sm text-amber-600';
  }
  renderGrid();
}

function renderGrid() {
  const q = $('search').value.trim().toLowerCase();
  const shown = q ? products.filter(p => p.name.toLowerCase().includes(q)) : products;

  $('grid').innerHTML = shown.map(p => `
    <button data-id="${esc(p.id)}" ${p.stock <= 0 ? 'disabled' : ''}
            class="flex flex-col items-start rounded-lg border border-slate-200 p-3 text-left
                   hover:border-slate-900 hover:bg-slate-50 focus:outline-none
                   focus:ring-2 focus:ring-slate-900 disabled:opacity-40">
      <span class="font-medium">${esc(p.name)}</span>
      <span class="text-sm text-slate-500">${money(p.price)}</span>
      <span class="mt-1 text-xs text-slate-400">${p.stock} in stock</span>
    </button>`).join('') || '<p class="col-span-full text-sm text-slate-500">No matches.</p>';
}

// ---------------------------------------------------------------------------
// Cart
// ---------------------------------------------------------------------------
function add(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const line = cart.get(id) ?? { ...p, qty: 0 };
  if (line.qty >= p.stock) return;          // never sell past stock on hand
  line.qty++;
  cart.set(id, line);
  renderCart();
}

function setQty(id, qty) {
  const line = cart.get(id);
  if (!line) return;
  if (qty <= 0) cart.delete(id);
  else line.qty = Math.min(qty, line.stock);
  renderCart();
}

const subtotalCents = () =>
  [...cart.values()].reduce((s, l) => s + l.price * l.qty, 0);

/** Tax applied to the whole subtotal, rounded to cents once. Rounding each
 *  line and summing gives a total that doesn't match the printed lines. */
const totalCents = () => Math.round(subtotalCents() * (1 + TAX_RATE));

function renderCart() {
  $('cart').innerHTML = [...cart.values()].map(l => `
    <li class="flex items-center gap-2 py-2">
      <span class="flex-1 truncate">${esc(l.name)}</span>
      <button data-dec="${esc(l.id)}" aria-label="One less ${esc(l.name)}"
              class="h-7 w-7 rounded border border-slate-300 hover:bg-slate-100">−</button>
      <span class="w-6 text-center tabular-nums">${l.qty}</span>
      <button data-inc="${esc(l.id)}" aria-label="One more ${esc(l.name)}"
              class="h-7 w-7 rounded border border-slate-300 hover:bg-slate-100">+</button>
      <span class="w-14 text-right tabular-nums">${money(l.price * l.qty)}</span>
    </li>`).join('') || '<li class="py-2 text-sm text-slate-500">Empty</li>';

  const subtotal = subtotalCents();
  const total = totalCents();
  $('subtotal').textContent = money(subtotal);
  // Derived so subtotal + tax always equals the total shown, with no
  // off-by-a-cent from rounding the two independently.
  $('tax').textContent = money(total - subtotal);
  $('total').textContent = money(total);
  $('taxpct').textContent = TAX_RATE * 100;
  $('checkout').disabled = cart.size === 0;
}

// ---------------------------------------------------------------------------
// Checkout. client_ref makes a retry idempotent server-side, so a lost
// response can't become a double charge.
// ---------------------------------------------------------------------------
async function checkout() {
  const items = [...cart.values()].map(({ id, name, price, qty }) => ({ id, name, price, qty }));
  const total = totalCents();

  $('checkout').disabled = true;
  $('receipt').textContent = 'Charging…';

  let error = null;
  try {
    const res = await api('/sales', {
      method: 'POST',
      body: JSON.stringify({
        client_ref: crypto.randomUUID(),
        source: 'web',
        total,
        items,
      }),
    });
    if (!res.ok) error = { message: `HTTP ${res.status} ${await res.text()}` };
  } catch (err) {
    error = { message: err.message };
  }

  if (error) {
    $('receipt').textContent = `Not logged: ${error.message}`;
    $('receipt').className = 'mt-2 min-h-5 text-sm text-red-600';
    $('checkout').disabled = false;
    return;
  }

  $('receipt').textContent = `Paid ${money(total)} — sale logged.`;
  $('receipt').className = 'mt-2 min-h-5 text-sm text-emerald-600';
  cart.clear();
  renderCart();
  loadProducts();   // pick up any stock changes made elsewhere
}

// ---------------------------------------------------------------------------
// Wiring — one delegated listener per container instead of per button.
// ---------------------------------------------------------------------------
$('grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b) add(b.dataset.id);
});

$('cart').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.inc) setQty(b.dataset.inc, (cart.get(b.dataset.inc)?.qty ?? 0) + 1);
  if (b.dataset.dec) setQty(b.dataset.dec, (cart.get(b.dataset.dec)?.qty ?? 0) - 1);
});

$('search').addEventListener('input', renderGrid);
$('checkout').addEventListener('click', checkout);

renderCart();
loadProducts();
</script>
</body>
</html>
