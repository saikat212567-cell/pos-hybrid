name: Android verification

on:
  push:
    branches:
      - fix/refund-reversal-foundation
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"
permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run Android tests and assemble debug APK
        working-directory: android
        run: gradle test assembleDebug --no-daemon
