name: Build APK

# Builds the debug APK in the cloud so nothing has to compile on the old PC.
# Push to main, or hit "Run workflow" in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle and caches dependencies between runs. Using Gradle
      # directly means the repo does not need a committed gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: android
        run: gradle test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        # Credentials come from repository secrets, not from source.
        # Settings -> Secrets and variables -> Actions -> New secret.
        run: |
          gradle assembleDebug --no-daemon \
            -PsupabaseUrl="${{ secrets.SUPABASE_URL }}" \
            -PsupabaseAnonKey="${{ secrets.SUPABASE_ANON_KEY }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
